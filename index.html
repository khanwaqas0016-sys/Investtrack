<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvestTrack Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .fly-dollar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        font-weight: 800;
        color: #1e293b;
        opacity: 0;
        z-index: 9999;
        padding: 5px 15px; 
        border-radius: 50px;
        animation-duration: 1.2s;
        animation-timing-function: ease-out;
        pointer-events: none;
        white-space: nowrap;
      }

      .fly-up {
        bottom: 10%;
        background: rgba(239, 68, 68, 0.25);
        animation-name: flyUp;
      }

      @keyframes flyUp {
        0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.5); }
        10% { opacity: 1; transform: translateX(-50%) translateY(-20px) scale(1); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-400px) scale(1); }
      }

      .fly-down {
        top: 10%;
        background: rgba(16, 185, 129, 0.25);
        animation-name: flyDown;
      }

      @keyframes flyDown {
        0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.5); }
        10% { opacity: 1; transform: translateX(-50%) translateY(20px) scale(1); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-400px) scale(1); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script>
      window.showDollarAnimation = function(type) {
        const count = 10;
        for (let i = 0; i < count; i++) {
          const div = document.createElement("div");
          div.classList.add("fly-dollar");
          if (type === "give") {
            div.classList.add("fly-up");
          } else {
            div.classList.add("fly-down");
          }
          div.textContent = "Rs"; 
          const randomLeft = 30 + Math.random() * 40;
          div.style.left = randomLeft + "%";
          const randomSize = 20 + Math.random() * 20;
          div.style.fontSize = randomSize + "px";
          const randomDelay = Math.random() * 0.5;
          div.style.animationDelay = randomDelay + "s";
          const randomDuration = 1 + Math.random() * 0.8;
          div.style.animationDuration = randomDuration + "s";
          document.body.appendChild(div);
          setTimeout(() => div.remove(), (randomDuration + randomDelay) * 1000 + 100); 
        }
      };
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
